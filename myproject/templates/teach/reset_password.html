{% load static %}
<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>

  <!-- Global styles -->
  <link rel="stylesheet" href="{% static 'teach/css/style.css' %}">
  <script src="{% static 'teach/js/script.js' %}"></script>

  <style>
    input[type="password"]{
      color:#000 !important;
      -webkit-text-fill-color:#000 !important;
      background-color:rgba(255,255,255,.9) !important;
      border-radius:16px !important;
      padding:12px 14px !important;
      border:1px solid rgba(148,163,184,.6) !important;
      width:100%;
    }

    input[type="password"]:focus{
      outline:none;
      box-shadow:0 0 0 3px rgba(59,130,246,.25) !important;
      border-color: rgba(59,130,246,.6) !important;
    }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center px-4">

  <section class="w-full max-w-5xl
    bg-white/80 dark:bg-slate-900/70
    backdrop-blur-xl
    border border-white/30 dark:border-slate-800/60
    rounded-3xl shadow-2xl
    overflow-hidden">

    <div class="grid grid-cols-1 md:grid-cols-2">

      <!-- IMAGE (Mobile top / Desktop left) -->
      <div class="relative w-full h-56 md:h-auto">
        <img
          src="{% static 'teach/img/edit.png' %}"
          alt="Reset Password"
          class="absolute inset-0 w-full h-full object-cover"
        />
        <div class="absolute inset-0 bg-black/25"></div>
      </div>

      <!-- CONTENT -->
      <div class="p-6 sm:p-8 flex flex-col justify-center">

        <!-- Header -->
        <div class="flex items-center gap-3 mb-4">
          <span class="material-icons-outlined text-primary text-3xl">lock_reset</span>
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight">
            Reset Password
          </h1>
        </div>

        <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">
          Update your password to keep your account secure
        </p>

        <!-- Form -->
        <form method="post" class="space-y-5">
          {% csrf_token %}

          <div class="space-y-1">
            <label class="text-xs font-bold tracking-wider uppercase text-slate-500 dark:text-slate-400">
              Old Password
            </label>
            {{ form.old_password }}
          </div>

          <div class="space-y-1">
            <label class="text-xs font-bold tracking-wider uppercase text-slate-500 dark:text-slate-400">
              New Password
            </label>
            {{ form.new_password1 }}
          </div>

          <div class="space-y-1">
            <label class="text-xs font-bold tracking-wider uppercase text-slate-500 dark:text-slate-400">
              Confirm New Password
            </label>
            {{ form.new_password2 }}
          </div>

          <!-- Actions -->
          <div class="pt-4 flex gap-3">
            <button type="submit"
              class="flex-1 py-3 rounded-2xl bg-primary text-white font-bold hover:opacity-90 transition">
              Save
            </button>

            <a href="{% url 'profile' %}"
               class="flex-1 py-3 rounded-2xl text-center
                      bg-slate-100 dark:bg-slate-800
                      text-slate-500 font-bold
                      hover:opacity-90 transition">
              Cancel
            </a>
          </div>
        </form>

      </div>
    </div>
  </section>

</body>
</html>
