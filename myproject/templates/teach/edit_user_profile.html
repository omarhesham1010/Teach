{% load static %}
<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Edit Profile</title>

  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>

  <link rel="stylesheet" href="{% static 'teach/css/style.css' %}">
  <script src="{% static 'teach/js/script.js' %}"></script>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 pb-24">

  <!-- NAV -->
  <nav class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
    <a href="{% url 'profile' %}" class="flex items-center gap-2">
      <span class="material-icons-outlined text-primary">arrow_back</span>
      <span class="font-bold text-lg tracking-tight">Edit Profile</span>
    </a>
    <button onclick="toggleDarkMode()" class="text-slate-500 hover:text-primary">
      <span class="material-icons-outlined">dark_mode</span>
    </button>
  </nav>

  <main class="px-4 py-6">
    <div class="max-w-3xl mx-auto space-y-6">

      <!-- CARD -->
      <section class="bg-white/70 dark:bg-slate-900/60 backdrop-blur-xl rounded-3xl shadow-2xl
                      border border-white/20 dark:border-slate-800/60 p-5 sm:p-7 md:p-8">

        <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Update Your Information</h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
          Make changes then press Save.
        </p>

        <form method="POST" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5 md:gap-6">
          {% csrf_token %}

          <!-- First / Last from user -->
          <div class="space-y-2">
            <label class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">First Name</label>
            <input name="first_name" value="{{ user.first_name }}" class="w-full rounded-2xl px-4 py-3.5 text-sm bg-slate-50 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/50 focus:ring-2 focus:ring-primary/40">
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Last Name</label>
            <input name="last_name" value="{{ user.last_name }}" class="w-full rounded-2xl px-4 py-3.5 text-sm bg-slate-50 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/50 focus:ring-2 focus:ring-primary/40">
          </div>

          <!-- Profile fields -->
          <div class="space-y-2">
            <label class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Second Name</label>
            <input name="second_name" value="{{ profile.second_name }}" class="w-full rounded-2xl px-4 py-3.5 text-sm bg-slate-50 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/50 focus:ring-2 focus:ring-primary/40">
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Third Name</label>
            <input name="third_name" value="{{ profile.third_name }}" class="w-full rounded-2xl px-4 py-3.5 text-sm bg-slate-50 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/50 focus:ring-2 focus:ring-primary/40">
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Gender</label>
            <select name="gender" class="w-full rounded-2xl px-4 py-3.5 text-sm bg-slate-50 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/50 focus:ring-2 focus:ring-primary/40">
              <option value="" {% if not profile.gender %}selected{% endif %}>—</option>
              <option value="Male" {% if profile.gender == "Male" %}selected{% endif %}>Male</option>
              <option value="Female" {% if profile.gender == "Female" %}selected{% endif %}>Female</option>
            </select>
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Phone Number</label>
            <input name="phone_number" value="{{ profile.phone_number|default:profile.phone }}" class="w-full rounded-2xl px-4 py-3.5 text-sm bg-slate-50 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/50 focus:ring-2 focus:ring-primary/40">
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Father Phone Number</label>
            <input name="father_phone_number" value="{{ profile.father_phone_number }}" class="w-full rounded-2xl px-4 py-3.5 text-sm bg-slate-50 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/50 focus:ring-2 focus:ring-primary/40">
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Mother Phone Number</label>
            <input name="mother_phone_number" value="{{ profile.mother_phone_number }}" class="w-full rounded-2xl px-4 py-3.5 text-sm bg-slate-50 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/50 focus:ring-2 focus:ring-primary/40">
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">School Name</label>
            <input name="school_name" value="{{ profile.school_name }}" class="w-full rounded-2xl px-4 py-3.5 text-sm bg-slate-50 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/50 focus:ring-2 focus:ring-primary/40">
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Parent's Job</label>
            <input name="parents_job" value="{{ profile.parents_job }}" class="w-full rounded-2xl px-4 py-3.5 text-sm bg-slate-50 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/50 focus:ring-2 focus:ring-primary/40">
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Government</label>
            <input name="government" value="{{ profile.government }}" class="w-full rounded-2xl px-4 py-3.5 text-sm bg-slate-50 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/50 focus:ring-2 focus:ring-primary/40">
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Grade</label>
            <input name="grade" value="{{ profile.grade }}" class="w-full rounded-2xl px-4 py-3.5 text-sm bg-slate-50 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/50 focus:ring-2 focus:ring-primary/40">
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Division</label>
            <select name="division" class="w-full rounded-2xl px-4 py-3.5 text-sm bg-slate-50 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/50 focus:ring-2 focus:ring-primary/40">
              <option value="" {% if not profile.division %}selected{% endif %}>—</option>
              <option value="Science" {% if profile.division == "Science" %}selected{% endif %}>Science</option>
              <option value="Mathmatics" {% if profile.division == "Mathmatics" %}selected{% endif %}>Mathmatics</option>
              <option value="Literature" {% if profile.division == "Literature" %}selected{% endif %}>Literature</option>
            </select>
          </div>

          <div class="space-y-2">
            <label class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">Gmail</label>
            <input name="gmail" value="{{ profile.gmail|default:user.email }}" class="w-full rounded-2xl px-4 py-3.5 text-sm bg-slate-50 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/50 focus:ring-2 focus:ring-primary/40">
          </div>

          <div class="space-y-2 md:col-span-2">
            <label class="text-[11px] font-bold tracking-wider text-slate-500 dark:text-slate-400 uppercase">National ID</label>
            <input name="national_id" value="{{ profile.national_id }}" class="w-full rounded-2xl px-4 py-3.5 text-sm bg-slate-50 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/50 focus:ring-2 focus:ring-primary/40">
          </div>

          <!-- Actions -->
          <div class="md:col-span-2 flex flex-col sm:flex-row gap-3 pt-2">
            <button type="submit"
              class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-primary text-white font-bold hover:opacity-90 transition">
              Save Changes
            </button>

            <a href="{% url 'profile' %}"
              class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-100 font-bold text-center hover:opacity-90 transition">
              Cancel
            </a>
          </div>

        </form>
      </section>

    </div>
  </main>

</body>
</html>
